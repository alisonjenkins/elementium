[package]
name = "elementium-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio/video capture and playback (cpal, nokhwa)"

[dependencies]
elementium-types = { workspace = true }
# Pixel-layout conversion for the raw-capture paths. Capture's output contract is planar
# YUV, so a source handing over RGB has to be converted somewhere, and doing it here keeps
# every consumer of a captured frame dealing with one format.
elementium-codec = { workspace = true }
cpal = { workspace = true }
nokhwa = { workspace = true }
turbojpeg = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# SIMD-accelerated (AVX2/SSE/NEON, with scalar fallback) YUV<->RGB conversion.
yuv = "0.8"
pipewire = "0.10.0"
libspa = "0.10.0"
# For DMA-BUF import: a screencast buffer arrives as a DRM PRIME file descriptor, which
# has to be mmap'd and cache-synchronised by hand. `pipewire`'s MAP_BUFFERS only maps the
# MemPtr/MemFd types, and there is no safe wrapper in `libspa` for the dma-buf sync ioctl.
libc = "0.2"
zune-jpeg = "0.5.15"
zune-core = "0.5.1"

[dev-dependencies]
tracing-subscriber = { workspace = true }
elementium-observability-test = { workspace = true }
jpeg-encoder = "0.7.1"
# For the capture_attribution example's --screen mode: it needs the same portal call
# elementium-screen already makes, but depending on that crate from here would be a
# dependency in the wrong direction (elementium-screen depends on elementium-media, not the
# other way round), so the example makes the portal call directly instead.
ashpd = { version = "0.13", features = ["tokio", "screencast"] }
tokio = { workspace = true }

[lints]
workspace = true
