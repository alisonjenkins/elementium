[package]
name = "elementium-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen capture (Wayland via ashpd+pipewire, X11/macOS/Windows via xcap)"

[dependencies]
elementium-media = { version = "0.1.0", path = "../elementium-media" }
elementium-types = { workspace = true }
# Pixel-layout conversion: capture hands out planar YUV, xcap produces packed BGRA.
elementium-codec = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", features = ["tokio"] }
xcap = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = { workspace = true }

[lints]
workspace = true
