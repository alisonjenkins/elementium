[package]
name = "elementium-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio/video codec wrappers (Opus, VP8/VP9, pixel conversion)"

[dependencies]
elementium-types = { workspace = true }
opus = { workspace = true }
vpx-encode = { workspace = true }
env-libvpx-sys = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# SIMD-accelerated (AVX2/SSE/NEON, with scalar fallback) YUV<->RGB conversion,
# replacing hand-rolled per-pixel scalar float math on the video hot path.
yuv = "0.8"

# libjpeg-turbo, linked from the system (the devshell provides 3.1.4). MJPEG decode is the
# single largest cost on the capture path, and turbo's SIMD Huffman/IDCT plus its ability
# to emit YUV planes directly removes both the decode cost and the colour conversion that
# followed it.
turbojpeg = { workspace = true }

# VAAPI, for asking the GPU what it can encode. Optional and Linux-only: libva is a system
# library, and a machine without a GPU driver should fail to find hardware rather than fail
# to build.
[target.'cfg(target_os = "linux")'.dependencies]
libva-sys = { version = "0.1.2", optional = true }

[lints]
workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
jpeg-encoder = "0.7.1"
zune-core = "0.5.1"
zune-jpeg = "0.5.15"

[[bench]]
name = "media_pipeline"
harness = false

[[example]]
name = "pipeline_profile"
# Needs the JPEG encoder to build its fixture, which is a dev-dependency.
required-features = []

[features]
default = ["vaapi"]
# Hardware-encoder discovery through VAAPI.
vaapi = ["dep:libva-sys"]
