[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/elementium-types",
    "crates/elementium-codec",
    "crates/elementium-media",
    "crates/elementium-screen",
    "crates/elementium-webrtc",
    "crates/elementium-keyring",
    "crates/elementium-e2ee",
    "crates/elementium-observability-test",
]

# Warnings that are only ever read once scroll past; these are the groups whose
# findings we act on, so they fail the build instead.
[workspace.lints.rust]
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/anthropics/elementium"

[workspace.dependencies]
# Internal crates
elementium-types = { path = "crates/elementium-types" }
elementium-codec = { path = "crates/elementium-codec" }
elementium-media = { path = "crates/elementium-media" }
elementium-screen = { path = "crates/elementium-screen" }
elementium-webrtc = { path = "crates/elementium-webrtc" }
elementium-keyring = { path = "crates/elementium-keyring" }
elementium-e2ee = { path = "crates/elementium-e2ee" }
elementium-observability-test = { path = "crates/elementium-observability-test" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

# WebRTC
str0m = "0.16"

# Audio
cpal = "0.15"
opus = "0.3"

# Video
vpx-encode = "0.6"
env-libvpx-sys = { version = "5.1", features = ["generate"] }
# Software H.264 decode. A peer publishing H.264 was previously a black tile: the encoder
# side has had a VAAPI H.264 path for a while, but `NegotiatedDecoder` knew only VP8.
#
# Software rather than VAAPI, even though the VAAPI plumbing already exists here. Decode is
# the side that must never fail: a machine with no GPU driver, or a driver without H.264
# decode, still has to show the picture, and a decoder that works only where the encoder
# does would leave exactly the black tile this removes. openh264 vendors its own source and
# builds with `cc`, so it adds no system dependency.
openh264 = "0.9"

# Camera
nokhwa = { version = "0.10", features = ["input-native"] }
turbojpeg = { version = "1", default-features = false, features = ["pkg-config"] }

# Screen capture
xcap = "0.4"

# LiveKit signaling
livekit-protocol = "0.7"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
prost = "0.12"
url = "2"

# LiveKit access token minting (test-only, for the local-server integration test)
jsonwebtoken = "9"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"

# Media code is unusable at `opt-level = 0`.
#
# `just dev` builds the dev profile, and an unoptimised pixel loop is not slow by a
# constant factor -- the preview downscale measured 111ms per 720p frame in debug against
# 1.4ms in release, which capped the camera thread at 4fps and looked exactly like a
# capture fault. Debugging a media application in a build where the media does not run is
# not debugging it.
#
# Only the crates that touch pixels and samples are optimised, so app logic, the Tauri
# command layer, and everything worth stepping through keep full debug behaviour.
[profile.dev.package.elementium-codec]
opt-level = 3

[profile.dev.package.elementium-media]
opt-level = 3

[profile.dev.package.elementium-webrtc]
opt-level = 3

# Dependencies: libvpx, opus, the SIMD colour converters, str0m's crypto.
[profile.dev.package."*"]
opt-level = 3
