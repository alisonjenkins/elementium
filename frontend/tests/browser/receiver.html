<!doctype html>
<meta charset="utf-8" />
<title>Elementium receive-path probe</title>
<body>
  <p id="state">idle</p>
  <script>
    // Record every RTCPeerConnection the page creates, before livekit can make one.
    //
    // Stats are read from the connection itself rather than through livekit's track
    // objects: with E2EE the track is wrapped for insertable streams and its `receiver` is
    // not populated, so both `track.receiver.getStats()` and `getRTCStatsReport()` (which
    // is only a wrapper around it) return nothing. Going to the source removes the
    // dependency on livekit's internals entirely, and is the same trick the app's own shim
    // uses to intercept this API.
    window.__pcs = [];
    const NativePC = window.RTCPeerConnection;
    window.RTCPeerConnection = function (...args) {
      const pc = new NativePC(...args);
      window.__pcs.push(pc);
      return pc;
    };
    window.RTCPeerConnection.prototype = NativePC.prototype;
  </script>
  <script type="module">
    // Served by the Playwright fixture: /lk/ maps to livekit-client's dist directory, so
    // the page runs the same client library Element Call ships rather than a stand-in.
    import { Room, ExternalE2EEKeyProvider, BaseKeyProvider } from "/lk/livekit-client.esm.mjs";

    const params = new URLSearchParams(location.search);
    const url = params.get("url");
    const token = params.get("token");
    const keyHex = params.get("key");

    const state = document.getElementById("state");
    const setState = (s) => {
      state.textContent = s;
    };

    /** Errors surfaced to the driving test rather than dying silently in the console. */
    window.__errors = [];
    window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
    window.addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason)));

    function hexToBytes(hex) {
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i += 1) {
        out[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return out;
    }

    let room;
    if (keyHex) {
      // Same construction Element Call uses: an externally supplied raw key, handed to the
      // insertable-streams worker. This is the path that must be exercised -- a browser
      // decrypting our frames is exactly what no Rust-only test can stand in for.
      // Which key provider matters enormously, and is the whole point of the
      // `invalidation` tests:
      //
      //   ExternalE2EEKeyProvider forces `failureTolerance: -1` -- "accept wrong keys
      //   forever", per its own source comment -- so a receiver keeps trying regardless of
      //   how many frames failed.
      //
      //   BaseKeyProvider's defaults are what Element Call's own provider inherits:
      //   `failureTolerance: 10`. After ten failures at a key index the worker stops
      //   attempting decryption entirely and silently drops every later frame
      //   (livekit-client.e2ee.worker.mjs, `hasInvalidKeyAtIndex`), latched until a key
      //   event resets it.
      const useDefaultTolerance = params.get("provider") === "default";
      const keyProvider = useDefaultTolerance
        ? new BaseKeyProvider({ sharedKey: true })
        : new ExternalE2EEKeyProvider();
      room = new Room({
        e2ee: {
          keyProvider,
          worker: new Worker("/lk/livekit-client.e2ee.worker.mjs", { type: "module" }),
        },
      });

      // `ExternalE2EEKeyProvider.setKey` only ever installs at index 0, but a rotating
      // sender stamps a changing index into every frame trailer. Element Call installs keys
      // at explicit indices through `onSetEncryptionKey`, so the probe does the same --
      // importing the material exactly as livekit's own `createKeyMaterialFromBuffer` does.
      const installKey = async (bytes, index) => {
        const material = await crypto.subtle.importKey("raw", bytes, "HKDF", false, [
          "deriveBits",
          "deriveKey",
        ]);
        keyProvider.onSetEncryptionKey(material, undefined, index);
      };

      const base = hexToBytes(keyHex);
      const rotations = Number(params.get("rotations") ?? 0);
      // Same derivation as the publisher: base key with the index XORed into byte 0.
      const keyFor = (i) => {
        const key = Uint8Array.from(base);
        key[0] ^= i;
        return key;
      };

      // `keydelay` models the real key-distribution channel. Element Call publishes a new
      // key over Matrix and peers receive it some time later; if the sender switches to it
      // before they have it, every frame in that window is undecryptable -- which is heard
      // as part of a sentence going missing while the rest arrives cleanly. With no delay
      // the keys are pre-installed and the test measures only the wire handling of a
      // changing index.
      const keyDelayMs = Number(params.get("keydelay") ?? 0);
      const rotateMs = Number(params.get("rotatems") ?? 0);
      await installKey(keyFor(0), 0);
      for (let i = 1; i <= rotations; i += 1) {
        if (keyDelayMs > 0) {
          setTimeout(() => installKey(keyFor(i), i), i * rotateMs + keyDelayMs);
        } else {
          await installKey(keyFor(i), i);
        }
      }
      await room.setE2EEEnabled(true);
    } else {
      room = new Room();
    }

    /** Set once an audio track from the publisher has actually been subscribed. */
    window.__subscribed = false;

    // Subscription-level visibility: a track that is never subscribed and a track that is
    // subscribed but never decrypts are completely different faults, and without these the
    // symptom is identical ("no stats").
    window.__events = [];
    for (const ev of [
      "participantConnected",
      "trackPublished",
      "trackSubscribed",
      "trackSubscriptionFailed",
      "trackSubscriptionStatusChanged",
      "encryptionError",
      "disconnected",
    ]) {
      room.on(ev, (...a) => {
        window.__events.push(`${ev}:${a.map((x) => x?.sid ?? x?.identity ?? x?.kind ?? String(x)).join(",")}`);
      });
    }

    room.on("trackSubscribed", (track) => {
      if (track.kind === "audio") {
        // Attaching matters: an unattached track is not pulled through the jitter buffer,
        // so concealment counters would stay at zero regardless of what arrived.
        const el = track.attach();
        el.muted = true;
        document.body.appendChild(el);
        window.__audioTrack = track;
        window.__subscribed = true;
        setState("subscribed");
      }
    });

    /**
     * Inbound audio stats, read from every peer connection the page created.
     *
     * The measurement is not packet loss. `packetsLost` counts what never arrived, while
     * `concealedSamples` and the accelerate/decelerate counters count what arrived and
     * could not be played as sent -- a decryption failure, a jitter-buffer stall, or a
     * sender whose clock runs off. All of those stay invisible to RTCP, which is why the
     * sending side kept reporting a healthy stream while listeners heard a robot.
     */
    window.__stats = async () => {
      if (!window.__subscribed) return { error: "no audio track was subscribed" };

      for (const pc of window.__pcs) {
        const report = await pc.getStats();
        let inbound = null;
        report.forEach((s) => {
          if (s.type === "inbound-rtp" && s.kind === "audio") inbound = s;
        });
        if (!inbound) continue;

        let codec = null;
        report.forEach((s) => {
          if (s.type === "codec" && s.id === inbound.codecId) codec = s;
        });
        return {
          ssrc: inbound.ssrc ?? 0,
          mimeType: codec?.mimeType ?? null,
          packetsReceived: inbound.packetsReceived ?? 0,
          packetsLost: inbound.packetsLost ?? 0,
          concealedSamples: inbound.concealedSamples ?? 0,
          silentConcealedSamples: inbound.silentConcealedSamples ?? 0,
          concealmentEvents: inbound.concealmentEvents ?? 0,
          totalSamplesReceived: inbound.totalSamplesReceived ?? 0,
          insertedSamplesForDeceleration: inbound.insertedSamplesForDeceleration ?? 0,
          removedSamplesForAcceleration: inbound.removedSamplesForAcceleration ?? 0,
          jitter: inbound.jitter ?? 0,
        };
      }
      return {
        error: `no inbound-rtp audio stats on any of ${window.__pcs.length} peer connections`,
      };
    };

    setState("connecting");
    await room.connect(url, token, { autoSubscribe: true });
    setState("connected");
  </script>
</body>
