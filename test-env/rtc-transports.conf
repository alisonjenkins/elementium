# Answer the one endpoint synapse does not implement, and pass everything else to it.
#
# Element Web 1.12.11 decides whether Element Call is usable by calling
# `/_matrix/client/unstable/org.matrix.msc4143/rtc/transports`. If that fails it logs a
# warning and falls back to Jitsi -- it does *not* read `org.matrix.msc4143.rtc_foci` from
# `.well-known`, despite that being where the same information lives for other clients.
# Synapse has no such endpoint, so against this stack every call became a Jitsi call and no
# MatrixRTC code ran at all.
#
# Sitting in front of synapse rather than beside it keeps every URL unchanged: the homeserver
# is still `http://localhost:8008` to clients, to `public_baseurl`, and to `.well-known`.
server {
    listen 8008;
    listen [::]:8008;
    server_name localhost;

    # Bodies here are Matrix media uploads; the default 1m would reject them.
    client_max_body_size 50M;

    location = /_matrix/client/unstable/org.matrix.msc4143/rtc/transports {
        # Element Web sends this with an Authorization header, which makes it a preflighted
        # cross-origin request. Answering the preflight is not optional -- without it the
        # browser never sends the real request and the failure looks like the endpoint is
        # missing again.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin '*' always;
        default_type application/json;
        # The same focus `.well-known` advertises. Kept in step by hand, which is tolerable
        # for two lines in a test environment and is called out in the README.
        return 200 '{"rtc_transports":[{"type":"livekit","livekit_service_url":"http://localhost:8090"}]}';
    }

    location / {
        proxy_pass http://127.0.0.1:8108;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Synapse's sync endpoint is long-polling; the default 60s read timeout would break
        # every client's sync loop once a minute.
        proxy_read_timeout 300s;
    }
}
